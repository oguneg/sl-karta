# Production: docker compose up -d --build
# Needs server/.env (Trafiklab keys) and .env with DOMAIN=your.domain (see .env.example).
# HTTPS is handled by the server's shared Caddy proxy (~/proxy on the VPS): this service joins the
# external "web" network and declares its domain with labels.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: server/.env
    environment:
      DATA_DIR: /data
      API_PORT: 8787
    volumes:
      - sl-data:/data
    networks:
      - web
      - default
    labels:
      caddy: ${DOMAIN:?Set DOMAIN in .env}
      caddy.reverse_proxy: "{{upstreams 8787}}"
      caddy.encode: zstd gzip

networks:
  web:
    external: true

volumes:
  sl-data:
